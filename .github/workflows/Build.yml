name: Build Code Master AI
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: 35.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Extract & Auto-Fix Kotlin Syntax
        run: |
          python3 -c '
          import os, zipfile, glob
          # Extract zip
          for f in glob.glob("**/*.zip", recursive=True):
              try:
                  with zipfile.ZipFile(f, "r") as z:
                      z.extractall(".")
              except: pass
          
          # Find project root
          target_dir = "."
          for root, dirs, files in os.walk("."):
              if "settings.gradle.kts" in files or "settings.gradle" in files:
                  target_dir = root
                  break
          
          with open(os.path.join(target_dir, ".env"), "w") as f:
              f.write("GEMINI_API_KEY=MY_GEMINI_API_KEY\n")
          
          # FIX 1: Fix missing quotes in HomeScreen.kt
          home_file = os.path.join(target_dir, "app/src/main/java/com/example/ui/screens/home/HomeScreen.kt")
          if os.path.exists(home_file):
              with open(home_file, "r", encoding="utf-8") as f:
                  content = f.read()
              content = content.replace("else \"Solve Puzzle\n", "else \"Solve Puzzle\",\n")
              content = content.replace("else \"Solve Puzzle \n", "else \"Solve Puzzle\",\n")
              with open(home_file, "w", encoding="utf-8") as f:
                  f.write(content)

          # FIX 2: Fix invalid Icon in PracticeScreen.kt
          practice_file = os.path.join(target_dir, "app/src/main/java/com/example/ui/screens/practice/PracticeScreen.kt")
          if os.path.exists(practice_file):
              with open(practice_file, "r", encoding="utf-8") as f:
                  content = f.read()
              content = content.replace("Icons.Default.Stars", "Icons.Default.Star")
              with open(practice_file, "w", encoding="utf-8") as f:
                  f.write(content)

          # FIX 3: Fix Room Database fallback argument error
          db_file = os.path.join(target_dir, "app/src/main/java/com/example/data/local/CodeMasterDatabase.kt")
          if os.path.exists(db_file):
              with open(db_file, "r", encoding="utf-8") as f:
                  content = f.read()
              content = content.replace("fallbackToDestructiveMigration(true)", "fallbackToDestructiveMigration()")
              with open(db_file, "w", encoding="utf-8") as f:
                  f.write(content)

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"PROJECT_ROOT={os.path.abspath(target_dir)}\n")
          '

      - name: Write Stable Configuration
        run: |
          cd "$PROJECT_ROOT"

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.configuration-cache=false
          kotlin.compiler.execution.strategy=in-process
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = java.net.URI("https://jitpack.io") }
              }
          }
          rootProject.name = "Code Master AI"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
              id("com.google.devtools.ksp") version "2.0.21-1.0.27" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("com.google.devtools.ksp")
          }

          android {
              namespace = "com.example"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.aistudio.codemaster.xkmz"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
                  buildConfigField("String", "GEMINI_API_KEY", "\"MY_GEMINI_API_KEY\"")
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
                  debug {
                      isDebuggable = true
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
                  freeCompilerArgs += listOf("-Xskip-prerelease-check", "-Xopt-in=kotlin.RequiresOptIn")
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.10.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-core")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation("androidx.navigation:navigation-compose:2.8.3")

              implementation("androidx.room:room-runtime:2.6.1")
              implementation("androidx.room:room-ktx:2.6.1")
              ksp("androidx.room:room-compiler:2.6.1")

              implementation("io.coil-kt:coil-compose:2.7.0")
              implementation("com.squareup.retrofit2:retrofit:2.11.0")
              implementation("com.squareup.retrofit2:converter-moshi:2.11.0")
              implementation("com.squareup.moshi:moshi-kotlin:1.15.2")
              ksp("com.squareup.moshi:moshi-kotlin-codegen:1.15.2")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("com.squareup.okhttp3:logging-interceptor:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0")
          }
          EOF

      - name: Build Code Master APK
        run: |
          cd "$PROJECT_ROOT"
          gradle assembleDebug --no-daemon -x test -x lint > build.log 2>&1 || {
              echo "🚨 KOTLIN SYNTAX ERROR DETECTED 🚨"
              grep -E "e: .*\.kt" build.log | tail -n 25
              exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Code-Master-AI-APK
          path: "**/build/outputs/apk/debug/*.apk"
