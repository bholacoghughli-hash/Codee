name: Build APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect Android Project Root
        shell: bash
        run: |
          set -e

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE" \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)"

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"
          else
            PROJECT_ROOT="$GITHUB_WORKSPACE"
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          if [ ! -d "$PROJECT_ROOT" ]; then
            echo "ERROR: Project root does not exist."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify Project Structure
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "===== PROJECT ROOT ====="
          pwd

          echo "===== FILES ====="
          find . -maxdepth 2 -type f | sort | head -200

          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "ERROR: settings.gradle.kts or settings.gradle not found."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ] && [ ! -f "app/build.gradle" ]; then
            echo "ERROR: app/build.gradle.kts or app/build.gradle not found."
            exit 1
          fi

      - name: Check Gradle
        shell: bash
        run: |
          cd "$PROJECT_ROOT"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --version
          else
            gradle --version
          fi

      - name: Clean Project
        shell: bash
        run: |
          cd "$PROJECT_ROOT"

          if [ -f "./gradlew" ]; then
            ./gradlew clean --no-daemon
          else
            gradle clean --no-daemon
          fi

      - name: Run Gradle Build
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew

            ./gradlew \
              assembleDebug \
              --no-daemon \
              --stacktrace
          else
            gradle \
              assembleDebug \
              --no-daemon \
              --stacktrace
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK="$(find "$PROJECT_ROOT" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Code-Master-AI-Debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
